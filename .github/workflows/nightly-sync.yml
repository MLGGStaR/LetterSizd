name: nightly-sync
on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC = 07:00 UAE, daily, no PC or phone needed
  workflow_dispatch:
concurrency: nightly-sync
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh every account
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node sync/nightly.mjs